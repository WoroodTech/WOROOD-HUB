# nginx terminates TLS; the Node process listens only on loopback and is never
# directly reachable.
upstream worood_hub_api { server 127.0.0.1:3000; keepalive 32; }

# A flash sale is a legitimate burst, so the webhook endpoint gets its own
# generous zone rather than loosening the limit that protects the login route.
limit_req_zone $binary_remote_addr zone=shopify_webhooks:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 443 ssl http2;
    server_name hub.worood.co;

    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/worood-hub;
    location / { try_files $uri $uri/ /index.html; }

    location /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://worood_hub_api;
        include /etc/nginx/proxy_params;
    }

    # Short timeout on purpose: a slow response here costs the subscription,
    # because Shopify deletes one after eight consecutive failures.
    location /api/v1/sales/webhooks/shopify {
        limit_req zone=shopify_webhooks burst=200 nodelay;
        proxy_request_buffering off;
        proxy_read_timeout 10s;
        proxy_pass http://worood_hub_api;
        include /etc/nginx/proxy_params;
    }

    location /api/ { proxy_pass http://worood_hub_api; include /etc/nginx/proxy_params; }

    location /socket.io/ {
        proxy_pass http://worood_hub_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }
}
