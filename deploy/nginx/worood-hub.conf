# WOROOD HUB — nginx site
#
# Installed to /etc/nginx/sites-available/worood-hub.conf by ec2-bootstrap.sh,
# which substitutes @HUB_HOSTNAME@, @DEPLOY_ROOT@ and @API_PORT@.
#
# ---------------------------------------------------------------------------
# IMPORTANT: certbot --nginx REWRITES THIS FILE IN PLACE.
#
# After the certificate is issued, the installed copy will contain the
# ssl_certificate lines, a second server block and the HTTP->HTTPS redirect,
# none of which are in this template. ec2-bootstrap.sh detects that and
# refuses to overwrite it.
#
# To change this file after TLS is in place, edit the INSTALLED copy at
# /etc/nginx/sites-available/worood-hub.conf, and mirror the change back
# here so the repository stays the source of truth.
# ---------------------------------------------------------------------------

server {
    listen 80;

    # Remove this line if the kernel has IPv6 disabled (ipv6.disable=1).
    # nginx fails to start rather than skipping the listener, and the error —
    # "Address family not supported by protocol" — does not obviously point
    # here. A VPC without IPv6 addressing is fine; a kernel without IPv6 is
    # not.
    listen [::]:80;

    server_name @HUB_HOSTNAME@;

    # The web root is a symlink into the current release, swapped atomically
    # by release.sh. nginx resolves it per request, so a release does not
    # need an nginx restart — only a reload, and strictly speaking not even
    # that.
    root @DEPLOY_ROOT@/current/web;
    index index.html;

    # The React bundle is already gzipped by the build for the large assets,
    # but the HTML shell and any JSON are not.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # Uploads are not a feature of Module 1. Keep the body small so a
    # malformed or hostile request is rejected early. Module 2's webhook
    # location below raises this for that path only.
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    server_tokens off;

    # --- Security headers ---------------------------------------------------
    # certbot does not add these. HSTS is deliberately commented out until
    # the certificate exists: sending it over plain HTTP, or before you are
    # certain every hostname under worood.co can serve HTTPS, locks browsers
    # out of anything that cannot. Uncomment it after §12 of the runbook and
    # after you have loaded the portal successfully over HTTPS at least once.
    #
    # add_header Strict-Transport-Security "max-age=31536000" always;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # --- ACME ---------------------------------------------------------------
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    # --- Sign-in: rate limited ----------------------------------------------
    # Declared before the general /api/ location so it wins. burst=5 nodelay
    # lets a genuine retry through immediately and queues nothing.
    location = /api/v1/auth/login {
        limit_req zone=worood_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:@API_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API ----------------------------------------------------------------
    location /api/ {
        limit_req zone=worood_api burst=60 nodelay;

        # No trailing slash on proxy_pass: the path reaches the application
        # unmodified, so the app's own /api/v1 prefix still matches. Adding a
        # slash here would strip /api/ and break every route.
        proxy_pass http://127.0.0.1:@API_PORT@;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # X-Forwarded-For is what the audit log records as the source IP, so
        # the application must be configured to trust this proxy — in NestJS,
        # app.set('trust proxy', 1). Without it every audit entry reads
        # 127.0.0.1 and the security model's IP recording is worthless.

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_buffering on;
        proxy_redirect off;
    }

    # --- Module 2: Socket.IO ------------------------------------------------
    # Inactive until the sales dashboard ships; harmless before then.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:@API_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # Long-lived connections. The default 60s read timeout would drop
        # every idle dashboard once a minute.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Shopify webhooks ----------------------------------------------------
    # The path is /api/v1/sales/webhooks/ -- @Controller('sales/webhooks') --
    # not /api/v1/sales-dashboard/webhooks/, which was written from the module's
    # directory name rather than its route. With the wrong prefix these fall
    # through to the general /api/ location and are rate limited, which is
    # exactly what the paragraph below says must not happen.
    #
    # Not rate limited: Shopify bursts on bulk operations, and a 429 to
    # Shopify costs a delivery. Eight consecutive failures and Shopify deletes
    # the subscription, leaving a dashboard that looks healthy and receives
    # nothing. HMAC verification in the application is the control here, not
    # the edge.
    location /api/v1/sales/webhooks/ {
        client_max_body_size 5m;

        proxy_pass http://127.0.0.1:@API_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The HMAC is computed over the RAW body. Any nginx module that
        # rewrites or re-encodes the body will break verification.
        proxy_request_buffering on;
    }

    # --- Static assets ------------------------------------------------------
    # Vite emits content-hashed filenames, so these can be cached hard and
    # forever. A new release changes the filename, not the cache entry.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /brand/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --- SPA fallback -------------------------------------------------------
    # index.html must never be cached, or a released bundle keeps loading the
    # previous asset filenames and the portal breaks for everyone who has
    # visited before.
    location / {
        try_files $uri $uri/ /index.html;

        location = /index.html {
            add_header Cache-Control "no-store, must-revalidate";
            expires off;
        }
    }

    # --- Noise --------------------------------------------------------------
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; return 200 "User-agent: *\nDisallow: /\n"; }

    # Deny anything that should never be served from the web root.
    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }

    access_log /var/log/nginx/worood-hub.access.log;
    error_log  /var/log/nginx/worood-hub.error.log warn;
}
