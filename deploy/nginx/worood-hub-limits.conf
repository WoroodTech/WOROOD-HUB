# WOROOD HUB — http-context directives
#
# Installed to /etc/nginx/conf.d/worood-hub-limits.conf
#
# limit_req_zone and map can only be declared in the http context, which is
# why they are here and not in the server block. Splitting them out also
# means certbot's rewrites of the site file cannot disturb them.

# Rate limit for the sign-in endpoint. The application throttles too, but
# doing it at the edge means a credential-stuffing run never reaches Node and
# never touches bcrypt, which is the expensive part.
#
# 10 requests/minute per IP with a burst of 5. A person mistyping a password
# never notices; a script trying a wordlist stops immediately.
limit_req_zone $binary_remote_addr zone=worood_login:10m rate=10r/m;

# A looser limit for the API as a whole, as a backstop against a runaway
# client. Generous enough that normal portal use never touches it.
limit_req_zone $binary_remote_addr zone=worood_api:10m rate=30r/s;

limit_req_status 429;
limit_req_log_level warn;

# Connection upgrade mapping for the Socket.IO gateway Module 2 adds. Harmless
# before that module exists.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
