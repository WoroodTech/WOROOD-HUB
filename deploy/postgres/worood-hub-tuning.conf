# WOROOD HUB — PostgreSQL tuning
#
# Installed to /etc/postgresql/<version>/main/conf.d/worood-hub.conf by
# ec2-bootstrap.sh, which substitutes the @PLACEHOLDER@ values from the
# instance's actual memory. Do not edit the installed copy — re-run the
# bootstrap script after changing this file, or the next bootstrap silently
# reverts your change.

# --- Network -----------------------------------------------------------------
# The database is never reachable from outside the instance. The Node process
# connects over loopback; nothing else connects at all.
listen_addresses = 'localhost'
port = 5432

# --- Memory ------------------------------------------------------------------
# 25% of RAM. Higher is a common mistake on a machine that also runs the
# application — PostgreSQL benefits more from the kernel page cache than from
# a larger private buffer pool at this scale.
shared_buffers = @SHARED_BUFFERS@

# A planner hint, not an allocation. Roughly three quarters of RAM tells the
# planner that most of this small database is cached, which is what makes it
# choose index scans over sequential scans for the availability queries.
effective_cache_size = @EFFECTIVE_CACHE_SIZE@

# Used by VACUUM, CREATE INDEX and ALTER TABLE — including the GiST index
# behind the exclusion constraint.
maintenance_work_mem = @MAINTENANCE_WORK_MEM@

# Per sort/hash operation, and a query can use several at once. 16 MB against
# a max of 100 connections is a worst case well inside the memory budget, and
# the availability queries sort small result sets.
work_mem = 16MB

# --- Connections -------------------------------------------------------------
# The API uses a connection pool; 100 is far more than 10-20 concurrent users
# need and costs little. If this ever becomes the constraint, the answer is a
# smaller pool in the application, not a larger number here.
max_connections = 100

# --- Write-ahead log ---------------------------------------------------------
wal_level = replica
max_wal_size = 2GB
min_wal_size = 256MB

# Spread checkpoint writes over most of the interval rather than spiking the
# disk at the end of it.
checkpoint_completion_target = 0.9

# --- Storage assumptions -----------------------------------------------------
# gp3 is SSD: random reads cost essentially the same as sequential ones, and
# the 4.0 default would push the planner towards sequential scans that are no
# cheaper here.
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Planner -----------------------------------------------------------------
# t4g.medium and t4g.large are 2 vCPU. Parallel query on a workload of small,
# selective queries adds coordination overhead for no benefit, so keep it
# modest rather than disabled.
max_worker_processes = 2
max_parallel_workers = 2
max_parallel_workers_per_gather = 1

# --- Timezone ----------------------------------------------------------------
# Every timestamp is timestamptz stored in UTC. Local office hours are
# interpreted against the site's own IANA timezone at query time, so the
# server clock must not introduce a second opinion about what "today" is.
timezone = 'UTC'
log_timezone = 'UTC'

# --- Logging -----------------------------------------------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%a.log'
log_rotation_age = 1d
log_rotation_size = 0
log_truncate_on_rotation = on

log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0

# Anything slower than a second on this workload is worth seeing. The
# availability query over a month of bookings should be single-digit
# milliseconds; if it is not, the index is not being used.
log_min_duration_statement = 1000

# Autovacuum activity, so a table that stops being vacuumed is visible before
# it becomes a performance problem.
log_autovacuum_min_duration = 250

# --- Statement timeouts ------------------------------------------------------
# No query in this application should take 30 seconds. A statement that does
# is a bug or a runaway, and killing it protects everyone else's requests.
statement_timeout = 30s

# A transaction left open by a crashed client holds locks and blocks vacuum.
idle_in_transaction_session_timeout = 60s

# --- Autovacuum --------------------------------------------------------------
# mr_reservations churns through status changes and cancellations, so vacuum
# a little more eagerly than the defaults.
autovacuum = on
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
