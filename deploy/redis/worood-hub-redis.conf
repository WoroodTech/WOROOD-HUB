# WOROOD HUB — Redis (Module 2: sales dashboard queue)
#
# Installed to /etc/redis/redis.conf.d/worood-hub.conf, or appended to
# /etc/redis/redis.conf on packaging that has no drop-in directory:
#
#   apt-get install -y redis-server
#   install -m 0644 deploy/redis/worood-hub-redis.conf /etc/redis/redis.conf.d/
#   systemctl restart redis-server
#
# Not installed by ec2-bootstrap.sh — Module 1 does not use Redis, and a queue
# with nothing to consume is just another process to keep alive.
#
# Local Redis rather than ElastiCache, deliberately: a managed Redis would add
# roughly the cost of the instance itself to serve a workload that fits in
# half a gigabyte on a machine that is already running. It shares the
# instance's failure domain, which is already true of PostgreSQL, so it
# changes nothing about the recovery model.

# --- Network -----------------------------------------------------------------
# Loopback only, same as PostgreSQL. Nothing outside this instance talks to it.
bind 127.0.0.1 -::1
port 6379
protected-mode yes

# --- Memory ------------------------------------------------------------------
maxmemory 512mb

# noeviction, NOT allkeys-lru. This is a job queue, not a cache: under memory
# pressure it must fail loudly and refuse writes rather than quietly discard
# queued jobs. A dropped job is a missed order update, which reconciliation
# would eventually repair — but not before someone noticed.
maxmemory-policy noeviction

# --- Persistence -------------------------------------------------------------
# AOF so a restart does not lose the queue. everysec bounds the worst-case
# loss to one second of jobs, which reconciliation covers comfortably.
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots off: AOF already covers durability, and the fork a snapshot
# requires briefly doubles Redis's memory footprint on an instance that has
# none to spare.
save ""

# --- Behaviour under failure -------------------------------------------------
# If the last background save failed, keep accepting writes anyway. With RDB
# disabled this should never fire, but the default would otherwise turn a
# disk hiccup into a queue outage.
stop-writes-on-bgsave-error no

# --- Logging -----------------------------------------------------------------
loglevel notice
syslog-enabled yes
syslog-ident worood-hub-redis

# --- Housekeeping ------------------------------------------------------------
# BullMQ uses blocking reads that hold a connection open indefinitely.
timeout 0
tcp-keepalive 300

# Keyspace notifications: BullMQ's delayed and repeatable jobs rely on
# expired-key events.
notify-keyspace-events Ex
