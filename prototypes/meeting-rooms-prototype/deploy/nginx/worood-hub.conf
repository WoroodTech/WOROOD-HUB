# ---------------------------------------------------------------------------
# WOROOD HUB — nginx reverse proxy
#
# The React bundle is served as static files; /api is proxied to the Node
# process on 127.0.0.1:3000, which is never exposed to the network directly.
# ---------------------------------------------------------------------------

# Modest rate limit on the sign-in endpoint to blunt credential stuffing.
limit_req_zone $binary_remote_addr zone=worood_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name hub.worood.co;

    # certbot rewrites this block to a 301 once TLS is issued.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hub.worood.co;

    # Managed by certbot.
    ssl_certificate     /etc/letsencrypt/live/hub.worood.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.worood.co/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 12M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------- frontend
    root /opt/worood-hub/web;
    index index.html;

    # Hashed asset filenames — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------- api
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    location = /api/v1/auth/login {
        limit_req zone=worood_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check for the load balancer / uptime monitor.
    location = /healthz {
        proxy_pass http://127.0.0.1:3000/api/v1/health;
        access_log off;
    }
}
