# Local development dependencies only. Both applications run directly, for fast
# reload -- the same arrangement Module 1 used.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: worood
      POSTGRES_PASSWORD: worood_dev
      POSTGRES_DB: worood_hub
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
volumes: { pgdata: {} }
